---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: inputs.rdsmetrics.fn.crossplane.io
spec:
  group: rdsmetrics.fn.crossplane.io
  names:
    categories:
    - crossplane
    kind: Input
    listKind: InputList
    plural: inputs
    singular: input
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Input can be used to provide input to this Function.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          databaseName:
            description: DatabaseName is the name of the RDS database instance to
              fetch metrics for
            type: string
          databaseNameRef:
            description: |-
              DatabaseNameRef is a reference to retrieve the database name (e.g., from status or context)
              Overrides DatabaseName field if used
            type: string
          identity:
            description: |-
              Identity selects how the function gets AWS credentials. Without it, the
              function reads static credentials from the "aws-creds" credentials block,
              as before (Secret source).
            properties:
              assumeRoleChain:
                description: |-
                  AssumeRoleChain assumes a chain of roles (in order) on top of the base
                  credentials resolved from Source.
                items:
                  description: AssumeRole describes a single STS AssumeRole hop.
                  properties:
                    externalID:
                      description: ExternalID to pass to AssumeRole, if the role's
                        trust policy requires it.
                      type: string
                    roleARN:
                      description: RoleARN is the role to assume.
                      type: string
                    roleSessionName:
                      description: RoleSessionName for the assumed role session.
                      type: string
                    tags:
                      additionalProperties:
                        type: string
                      description: Tags are session tags to pass to AssumeRole.
                      type: object
                    transitiveTagKeys:
                      description: |-
                        TransitiveTagKeys lists session tag keys that propagate to downstream
                        AssumeRole calls in the chain.
                      items:
                        type: string
                      type: array
                  required:
                  - roleARN
                  type: object
                type: array
              source:
                default: Secret
                description: Source of the base credentials.
                enum:
                - Secret
                - IRSA
                - WebIdentity
                - PodIdentity
                type: string
              webIdentity:
                description: |-
                  WebIdentity configures the AssumeRoleWithWebIdentity flow. Required when
                  Source is WebIdentity.
                properties:
                  roleARN:
                    description: RoleARN is the IAM role to assume with the web identity
                      token.
                    type: string
                  roleSessionName:
                    description: RoleSessionName is an optional session name for the
                      assumed role.
                    type: string
                  tokenConfig:
                    description: TokenConfig selects where the web identity token
                      comes from.
                    properties:
                      fsPath:
                        description: FSPath is the path to the token file when Source
                          is Filesystem.
                        type: string
                      source:
                        description: |-
                          Source of the token. With Secret, the token bytes arrive via the "aws-creds"
                          credentials block (key "token"). With Filesystem, FSPath is read.
                        enum:
                        - Secret
                        - Filesystem
                        type: string
                    required:
                    - source
                    type: object
                required:
                - roleARN
                type: object
            type: object
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          metrics:
            description: Metrics is a list of CloudWatch metrics to fetch
            items:
              type: string
            type: array
          period:
            description: Period is the granularity of the returned data points in
              seconds
            format: int32
            type: integer
          region:
            description: Region is the AWS region where the RDS instance is located
            type: string
          target:
            description: Target where to store the metrics result
            type: string
        required:
        - target
        type: object
    served: true
    storage: true
